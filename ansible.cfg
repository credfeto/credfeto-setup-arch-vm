[defaults]
# ansible-pull runs from this checkout, so this file applies to every host.
# The default 10 s connection/become timeout is too short on busy hosts: when a
# heavy job (e.g. a dotnet restore/build) is running, starting sudo can take
# longer than 10 s and the task fails with "Timed out waiting for become
# success" even though nothing is wrong with the play.
timeout = 30
