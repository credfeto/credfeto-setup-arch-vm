---
# A start in this run already loaded the current rules, so only an auditd
# that was running before the run needs restarting. audit_started is
# undefined when a task failed before Start auditd service and force_handlers
# runs this anyway; restart then, as the start never happened.
- name: Restart auditd
  ansible.builtin.systemd:
    name: auditd
    state: restarted
  when: audit_started is not defined or audit_started is not changed
  # Once -e 2 (immutable) rules are active in the running kernel, auditd cannot
  # reload changed rules without a reboot. If this handler fires after -e 2 is
  # set, the restart may fail at the augenrules step. The failure is expected
  # and intentional: the existing rules remain enforced and a reboot is required
  # to apply the new rule set.
  failed_when: false
