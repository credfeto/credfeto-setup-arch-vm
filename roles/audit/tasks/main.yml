---
- name: Install audit package
  community.general.pacman:
    name: audit
    state: present
    extra_args: "--noconfirm --needed"

- name: Ensure /etc/audit/rules.d directory exists
  ansible.builtin.file:
    path: /etc/audit/rules.d
    state: directory
    owner: root
    group: root
    mode: "0750"

- name: Write hardening audit rules
  ansible.builtin.copy:
    dest: /etc/audit/rules.d/hardening.rules
    owner: root
    group: root
    mode: "0640"
    content: |
      # Delete all existing rules on load
      -D

      # Set buffer size (increase if audit backlog warnings appear)
      -b 8192

      # Log execve calls from login sessions only (who ran what).
      # auid is the login UID and survives sudo/su, so anything a human runs
      # (including root via sudo) is still recorded. Daemons, systemd services
      # and timers (ansible-pull, docker/podman containers, batch jobs) have an
      # unset auid and are skipped: logging every execve on exec-heavy hosts
      # (git, dotnet, podman workloads) filled the audit backlog and stalled
      # processes in backlog_wait, costing far more than it recorded.
      -a always,exit -F arch=b64 -S execve -F auid>=1000 -F auid!=unset -k exec
      -a always,exit -F arch=b32 -S execve -F auid>=1000 -F auid!=unset -k exec
      -a always,exit -F arch=b64 -S execve -F auid=0 -k exec
      -a always,exit -F arch=b32 -S execve -F auid=0 -k exec

      # Monitor authentication files
      -w /etc/passwd -p wa -k auth
      -w /etc/shadow -p wa -k auth
      -w /etc/group -p wa -k auth
      -w /etc/sudoers -p wa -k auth
      -w /etc/sudoers.d/ -p wa -k auth

      # Monitor SSH config changes
      -w /etc/ssh/sshd_config -p wa -k sshd
      -w /etc/ssh/sshd_config.d/ -p wa -k sshd

      # Monitor kernel module loading
      -a always,exit -F arch=b64 -S init_module -S finit_module -k modules
      -a always,exit -F arch=b64 -S delete_module -k modules
      -a always,exit -F arch=b32 -S init_module -S finit_module -k modules
      -a always,exit -F arch=b32 -S delete_module -k modules

      # Monitor mount operations
      -a always,exit -F arch=b64 -S mount -S umount2 -k mounts
      -a always,exit -F arch=b32 -S mount -S umount2 -k mounts

      # Monitor time changes
      -a always,exit -F arch=b64 -S adjtimex -S settimeofday -S clock_settime -k time
      -a always,exit -F arch=b32 -S adjtimex -S settimeofday -S clock_settime -k time

      # Monitor firewall config
      -w /etc/firewalld/ -p wa -k firewall

      # Monitor Docker config
      -w /etc/docker/ -p wa -k docker

      # Make rules immutable (requires reboot to change)
      -e 2

# auditd's defaults flush to disk every 50 records (flush = INCREMENTAL_ASYNC,
# freq = 50). On a CoW root (btrfs) each of those small syncs rewrites whole
# extents, so a few MB/h of audit log became hundreds of kB/s of disk writes.
# Flushing every 1000 records keeps the same durability model (async, by
# record count) at a fraction of the write load.
- name: Set auditd flush frequency
  ansible.builtin.lineinfile:
    path: /etc/audit/auditd.conf
    regexp: "^\\s*{{ item.key }}\\s*="
    line: "{{ item.key }} = {{ item.value }}"
  loop:
    - {key: flush, value: INCREMENTAL_ASYNC}
    - {key: freq, value: "1000"}
  register: audit_auditd_conf

- name: Check whether auditd is already running
  ansible.builtin.command:
    cmd: systemctl is-active --quiet auditd  # noqa: command-instead-of-module - read-only probe
  register: audit_auditd_active
  changed_when: false
  failed_when: false
  when: audit_auditd_conf is changed  # noqa: no-handler - the probe must run before the reload it guards

# auditd refuses a manual stop/restart (RefuseManualStop) and the unit has no
# ExecReload; SIGHUP via auditctl makes the running daemon re-read auditd.conf.
# When auditd isn't running yet, the start below reads the new file instead.
- name: Reload auditd configuration
  ansible.builtin.command: auditctl --signal reload
  when: audit_auditd_conf is changed and audit_auditd_active.rc == 0
  changed_when: true

# This role is the only one that starts auditd: a start in an earlier role
# would load the old rules before the ones above are written, and with -e 2
# only a reboot could then apply them.
- name: Enable auditd service
  ansible.builtin.systemd:
    name: auditd
    enabled: true

# Separate from enabling so that changed here means auditd was actually
# started and so loaded the current rules; the reboot role relies on this to
# skip scheduling a reboot for a rules file this run has already applied.
- name: Start auditd service
  ansible.builtin.systemd:
    name: auditd
    state: started
  register: audit_started
