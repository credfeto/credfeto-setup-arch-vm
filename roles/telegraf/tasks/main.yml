---
- name: Install telegraf package
  community.general.pacman:
    name: telegraf
    state: present
    extra_args: "--noconfirm --needed"

- name: Deploy telegraf configuration
  ansible.builtin.template:
    src: telegraf.conf.j2
    dest: /etc/telegraf/telegraf.conf
    owner: root
    group: root
    mode: "0644"
    validate: telegraf --config %s --test
  register: telegraf_deploy_telegraf_configuration
  notify: Restart telegraf

- name: Record Restart telegraf as pending
  ansible.builtin.include_role:
    name: handler_retry
    tasks_from: pending
  vars:
    handler_retry_pending: [Restart telegraf]
  when: telegraf_deploy_telegraf_configuration is changed  # noqa: no-handler - marker must precede the handler

# The telegraf system user/group is created by the package above, so this
# must run after the install task. Only needed when container_runtime is
# docker: telegraf.conf's [[inputs.docker]] block (see telegraf.conf.j2) is
# itself gated on the same condition, so there is nothing for telegraf to
# read from the docker socket on podman hosts.
- name: Add telegraf user to docker group for Docker stats collection
  ansible.builtin.user:
    name: telegraf
    groups: docker
    append: true
  when: container_runtime == 'docker'

- name: Enable telegraf service
  ansible.builtin.systemd:
    name: telegraf
    enabled: true

# Separate from enabling so that changed here means telegraf was actually
# started, which the Restart telegraf handler relies on to skip a second
# start in the same run.
- name: Start telegraf service
  ansible.builtin.systemd:
    name: telegraf
    state: started
  register: telegraf_started
