---
# Deploy telegraf configuration validates telegraf.conf before writing it, but
# the file on disk may still be one it never wrote; check it here so the
# restart below never stops a running telegraf that then cannot start again.
- name: Check telegraf configuration before restarting telegraf
  ansible.builtin.command:
    cmd: telegraf --config /etc/telegraf/telegraf.conf --test
  register: telegraf_handler_config_check
  changed_when: false
  failed_when: false
  check_mode: false
  listen: Restart telegraf

# A start in this run already read the current telegraf.conf, so only a
# telegraf that was running before the run needs restarting. telegraf_started
# is undefined when a task failed before Start telegraf service and
# force_handlers runs this anyway; restart then, as the start never happened.
- name: Restart telegraf
  ansible.builtin.systemd:
    name: telegraf
    state: restarted
  when:
    - telegraf_handler_config_check.rc == 0
    - telegraf_started is not defined or telegraf_started is not changed

# telegraf.service is Type=notify, so the restart only completes once the
# service reports ready; is-active polls until the unit is up and fails the
# run when it never is.
- name: Check telegraf is running after restarting it
  ansible.builtin.command:
    cmd: systemctl is-active --quiet telegraf  # noqa: command-instead-of-module - read-only probe
  register: telegraf_handler_state
  changed_when: false
  until: telegraf_handler_state.rc == 0
  retries: 10
  delay: 1
  listen: Restart telegraf
  # Same condition as the restart: only check after a restart it made.
  when:
    - telegraf_handler_config_check.rc == 0
    - telegraf_started is not defined or telegraf_started is not changed

# A restart skipped because telegraf was started in this run still leaves it
# on the current telegraf.conf, so only a failed check keeps the marker.
- name: Clear pending marker for Restart telegraf
  ansible.builtin.file:
    path: "{{ handler_retry_dir }}/Restart telegraf"
    state: absent
  listen: Restart telegraf
  when: telegraf_handler_config_check.rc == 0
