---
# Cleanup legacy auto-update service if present
- name: Disable auto-update timer if present
  ansible.builtin.systemd:
    name: auto-update.timer
    enabled: false
    state: stopped
    daemon_reload: false
  failed_when: false

- name: Remove auto-update.timer unit
  ansible.builtin.file:
    path: /etc/systemd/system/auto-update.timer
    state: absent
  register: services_remove_auto_update_timer_unit
  notify: Reload systemd

- name: Record Reload systemd as pending
  ansible.builtin.include_role:
    name: handler_retry
    tasks_from: pending
  vars:
    handler_retry_pending: [Reload systemd]
  when: services_remove_auto_update_timer_unit is changed  # noqa: no-handler - marker must precede the handler

- name: Remove auto-update.service unit
  ansible.builtin.file:
    path: /etc/systemd/system/auto-update.service
    state: absent
  register: services_remove_auto_update_service_unit
  notify: Reload systemd

- name: Record Reload systemd as pending
  ansible.builtin.include_role:
    name: handler_retry
    tasks_from: pending
  vars:
    handler_retry_pending: [Reload systemd]
  when: services_remove_auto_update_service_unit is changed  # noqa: no-handler - marker must precede the handler

- name: Remove auto-update script
  ansible.builtin.file:
    path: /usr/local/bin/auto-update
    state: absent

# paccache-cleanup service + timer
- name: Install paccache-cleanup.service unit
  ansible.builtin.copy:
    src: paccache-cleanup.service
    dest: /etc/systemd/system/paccache-cleanup.service
    owner: root
    group: root
