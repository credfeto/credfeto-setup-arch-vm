  when: services_install_paccache_cleanup_service_unit is changed  # noqa: no-handler - marker must precede the handler

- name: Install paccache-cleanup.timer unit
  ansible.builtin.copy:
    src: paccache-cleanup.timer
    dest: /etc/systemd/system/paccache-cleanup.timer
    owner: root
    group: root
    mode: "0644"
  register: services_install_paccache_cleanup_timer_unit
  notify: Reload systemd

- name: Record Reload systemd as pending
  ansible.builtin.include_role:
    name: handler_retry
    tasks_from: pending
  vars:
    handler_retry_pending: [Reload systemd]
  when: services_install_paccache_cleanup_timer_unit is changed  # noqa: no-handler - marker must precede the handler

