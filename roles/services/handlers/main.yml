---
# Only reload when the cleanup unit check passed, or did not run (unchanged
# units with no pending marker).
- name: Reload systemd
  ansible.builtin.systemd:
    daemon_reload: true
  when: services_unit_check is not defined or services_unit_check is skipped or services_unit_check.rc == 0

# A start in this run already used the current drop-in, so only a timer that
# was running before the run needs restarting. services_fstrim_timer_started
# is undefined when a task failed before Start fstrim timer and
# force_handlers runs this anyway; restart then, as the start never happened.
- name: Restart fstrim timer
  ansible.builtin.systemd:
    name: fstrim.timer
    state: restarted
    daemon_reload: true
  when: services_fstrim_timer_started is not defined or services_fstrim_timer_started is not changed

# Timer units have no process to fork; is-active on the timer shows it is
# really armed after the restart.
- name: Check fstrim timer is running after restarting it
  ansible.builtin.command:
    cmd: systemctl is-active --quiet fstrim.timer  # noqa: command-instead-of-module - read-only probe
  register: services_fstrim_timer_state
  changed_when: false
  until: services_fstrim_timer_state.rc == 0
  retries: 10
  delay: 1
  listen: Restart fstrim timer
  # Same condition as the restart: only check after a restart it made.
  when: services_fstrim_timer_started is not defined or services_fstrim_timer_started is not changed

- name: Clear pending marker for Restart fstrim timer
  ansible.builtin.file:
    path: "{{ handler_retry_dir }}/Restart fstrim timer"
    state: absent
  listen: Restart fstrim timer
