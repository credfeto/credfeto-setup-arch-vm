---
# fail2ban_config_check is undefined when a task failed before Check fail2ban
# configuration and force_handlers runs these handlers anyway; check the
# configuration here then, so the restart below never runs into a broken one.
# A separate variable, because register on a skipped handler would overwrite
# the task's result.
- name: Check fail2ban configuration before restarting it
  ansible.builtin.shell:
    cmd: systemd-analyze verify /etc/systemd/system/fail2ban.service && fail2ban-client --test
    executable: /bin/bash
  register: fail2ban_handler_config_check
  changed_when: false
  failed_when: false
  when: fail2ban_config_check is not defined
  listen: Restart fail2ban

# A start in this run already read the current jail files and the reloaded
# unit, so only a fail2ban that was running before the run needs restarting.
# fail2ban_started is undefined when a task failed before Start fail2ban and
# force_handlers runs this anyway; restart then, as the start never happened.
# Never restart into a configuration that failed the check: the running
# fail2ban keeps its last good configuration and the run has already failed.
- name: Restart fail2ban
  ansible.builtin.systemd:
    name: fail2ban
    state: restarted
    daemon_reload: true
  when:
    - (fail2ban_config_check if fail2ban_config_check is defined else fail2ban_handler_config_check).rc == 0
    - fail2ban_started is not defined or fail2ban_started is not changed

# fail2ban.service is Type=simple, so the restart reports success as soon as
# the process is forked, even when fail2ban then exits, and is-active can
# read active just before it dies. fail2ban-client ping succeeds only once
# the server answers on its socket, so poll it and fail the run when it
# never does.
- name: Check fail2ban is running after restarting it
  ansible.builtin.command:
    cmd: fail2ban-client ping
  register: fail2ban_handler_state
  changed_when: false
  until: fail2ban_handler_state.rc == 0
  retries: 10
  delay: 1
  listen: Restart fail2ban
  # Same condition as the restart: only check after a restart it made.
  when:
    - (fail2ban_config_check if fail2ban_config_check is defined else fail2ban_handler_config_check).rc == 0
    - fail2ban_started is not defined or fail2ban_started is not changed

# A restart skipped because fail2ban was started in this run still leaves it
# on the current configuration, so only a failed check keeps the marker.
- name: Clear pending marker for Restart fail2ban
  ansible.builtin.file:
    path: "{{ handler_retry_dir }}/Restart fail2ban"
    state: absent
  listen: Restart fail2ban
  when: (fail2ban_config_check if fail2ban_config_check is defined else fail2ban_handler_config_check).rc == 0
