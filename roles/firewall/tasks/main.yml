---
# Before starting firewalld, so a start in this run already runs without the
# drop-in and the Restart firewalld handler is only needed when firewalld was
# running with it loaded.
- name: Remove legacy firewalld systemd security drop-in
  ansible.builtin.file:
    path: /etc/systemd/system/firewalld.service.d/security.conf
    state: absent
  register: firewall_legacy_dropin
  notify: Restart firewalld

- name: Record Restart firewalld as pending
  ansible.builtin.include_role:
    name: handler_retry
    tasks_from: pending
  vars:
    handler_retry_pending: [Restart firewalld]
  when: firewall_legacy_dropin is changed  # noqa: no-handler - marker must precede the handler

# daemon_reload so that a start below no longer applies a just-removed
# drop-in.
- name: Enable firewalld
  ansible.builtin.systemd:
    name: firewalld
    enabled: true
    daemon_reload: true

# Separate from enabling so that changed here means firewalld was actually
# started, which the Restart firewalld handlers rely on to skip a second
# start in the same run.
- name: Start firewalld
  ansible.builtin.systemd:
    name: firewalld
    state: started
  register: firewall_firewalld_started

# Allow SSH from IPv4 RFC-1918 private ranges
- name: Allow SSH from 10.0.0.0/8 (IPv4)
  ansible.posix.firewalld:
    rich_rule: >-
      rule family="ipv4" source address="10.0.0.0/8"
      port protocol="tcp" port="22" accept
    permanent: true
    state: enabled
  register: firewall_ssh_10
  notify: Reload firewalld

- name: Record Reload firewalld as pending
  ansible.builtin.include_role:
    name: handler_retry
    tasks_from: pending
  vars:
    handler_retry_pending: [Reload firewalld]
  when: firewall_ssh_10 is changed  # noqa: no-handler - marker must precede the handler

- name: Allow SSH from 192.168.0.0/16 (IPv4)
  ansible.posix.firewalld:
    rich_rule: >-
      rule family="ipv4" source address="192.168.0.0/16"
      port protocol="tcp" port="22" accept
    permanent: true
    state: enabled
  register: firewall_ssh_192
  notify: Reload firewalld

- name: Record Reload firewalld as pending
  ansible.builtin.include_role:
    name: handler_retry
    tasks_from: pending
  vars:
    handler_retry_pending: [Reload firewalld]
  when: firewall_ssh_192 is changed  # noqa: no-handler - marker must precede the handler

- name: Allow SSH from 172.16.0.0/12 (IPv4)
  ansible.posix.firewalld:
    rich_rule: >-
      rule family="ipv4" source address="172.16.0.0/12"
      port protocol="tcp" port="22" accept
    permanent: true
    state: enabled
  register: firewall_ssh_172
  notify: Reload firewalld

- name: Record Reload firewalld as pending
  ansible.builtin.include_role:
    name: handler_retry
    tasks_from: pending
  vars:
    handler_retry_pending: [Reload firewalld]
  when: firewall_ssh_172 is changed  # noqa: no-handler - marker must precede the handler

# Remove legacy incorrect 172.16.0.0/20 rule if present
- name: Remove legacy SSH rule for 172.16.0.0/20
  ansible.posix.firewalld:
    rich_rule: >-
      rule family="ipv4" source address="172.16.0.0/20"
      port protocol="tcp" port="22" accept
    permanent: true
    state: disabled
  register: firewall_legacy_ssh_172_20
  notify: Reload firewalld

- name: Record Reload firewalld as pending
  ansible.builtin.include_role:
    name: handler_retry
    tasks_from: pending
  vars:
    handler_retry_pending: [Reload firewalld]
  when: firewall_legacy_ssh_172_20 is changed  # noqa: no-handler - marker must precede the handler

# Allow SSH from IPv6 ULA and link-local ranges
- name: Allow SSH from fc00::/7 (IPv6 ULA)
  ansible.posix.firewalld:
    rich_rule: >-
      rule family="ipv6" source address="fc00::/7"
      port protocol="tcp" port="22" accept
    permanent: true
    state: enabled
  register: firewall_ssh_fc00
  notify: Reload firewalld

- name: Record Reload firewalld as pending
  ansible.builtin.include_role:
    name: handler_retry
    tasks_from: pending
  vars:
    handler_retry_pending: [Reload firewalld]
  when: firewall_ssh_fc00 is changed  # noqa: no-handler - marker must precede the handler

- name: Allow SSH from fe80::/10 (IPv6 link-local)
  ansible.posix.firewalld:
    rich_rule: >-
      rule family="ipv6" source address="fe80::/10"
      port protocol="tcp" port="22" accept
    permanent: true
    state: enabled
  register: firewall_ssh_fe80
  notify: Reload firewalld

- name: Record Reload firewalld as pending
  ansible.builtin.include_role:
    name: handler_retry
    tasks_from: pending
  vars:
    handler_retry_pending: [Reload firewalld]
  when: firewall_ssh_fe80 is changed  # noqa: no-handler - marker must precede the handler

- name: Enable masquerade permanently
  ansible.posix.firewalld:
    masquerade: true
    permanent: true
    state: enabled
  register: firewall_masquerade
  notify: Reload firewalld

- name: Record Reload firewalld as pending
  ansible.builtin.include_role:
    name: handler_retry
    tasks_from: pending
  vars:
    handler_retry_pending: [Reload firewalld]
  when: firewall_masquerade is changed  # noqa: no-handler - marker must precede the handler

# Docker zone: only needed when container_runtime is docker.
# Docker uses the nftables backend and does not register a firewalld zone.
- name: Check if docker firewalld zone exists
  ansible.builtin.command:
    cmd: firewall-cmd --permanent --info-zone=docker
  register: firewall_docker_zone_check
  changed_when: false
  failed_when: false
  when: container_runtime == 'docker'

- name: Create docker firewalld zone
  ansible.builtin.command:
    cmd: firewall-cmd --permanent --new-zone=docker
  when: container_runtime == 'docker' and firewall_docker_zone_check.rc != 0
  changed_when: true

- name: Set docker zone target to ACCEPT
  ansible.builtin.command:
    cmd: firewall-cmd --permanent --zone=docker --set-target=ACCEPT
  when: container_runtime == 'docker' and firewall_docker_zone_check.rc != 0
  changed_when: true

- name: Reload firewalld to activate docker zone
  ansible.builtin.command:
    cmd: firewall-cmd --reload
  when: container_runtime == 'docker' and firewall_docker_zone_check.rc != 0
  changed_when: true

- name: Assign Docker bridge subnet to docker zone
  ansible.posix.firewalld:
    zone: docker
    source: 172.16.0.0/12
    permanent: true
    state: enabled
  register: firewall_docker_ipv4_source
  notify: Reload firewalld
  when: container_runtime == 'docker'

- name: Record Reload firewalld as pending
  ansible.builtin.include_role:
    name: handler_retry
    tasks_from: pending
  vars:
    handler_retry_pending: [Reload firewalld]
  when: firewall_docker_ipv4_source is changed  # noqa: no-handler - marker must precede the handler

# Docker's IPv6 support here isn't backed by a fixed default-address-pools
# in daemon.json, so each Docker network gets its own randomly-assigned
# per-network ULA /64 (RFC 4193) rather than a subnet of one predictable
# range. Match the whole ULA space instead of a single network's /64, the
# same way the IPv4 rule above covers Docker's broader private range
# rather than one specific bridge subnet. This covers any Docker
# network's IPv6 prefix without per-host/per-network-specific config.
- name: Assign Docker bridge ULA range (IPv6) to docker zone
  ansible.posix.firewalld:
    zone: docker
    source: fd00::/8
    permanent: true
    state: enabled
  register: firewall_docker_ipv6_source
  notify: Reload firewalld
  when: container_runtime == 'docker'

- name: Record Reload firewalld as pending
  ansible.builtin.include_role:
    name: handler_retry
    tasks_from: pending
  vars:
    handler_retry_pending: [Reload firewalld]
  when: firewall_docker_ipv6_source is changed  # noqa: no-handler - marker must precede the handler
