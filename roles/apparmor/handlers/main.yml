---
# -r replaces the loaded profile in place, so the running sshd and every
# session it has spawned pick up the new rules without a restart.
- name: Reload sshd AppArmor profile
  ansible.builtin.command:
    cmd: apparmor_parser -r /etc/apparmor.d/usr.sbin.sshd
  changed_when: true
  # apparmor_kernel is undefined when a marker left by an earlier run notified
  # this and a task failed before the apparmor role ran; force_handlers still
  # runs it then, and the marker stays for the next run.
  when: apparmor_kernel is defined and apparmor_kernel.stat.exists

- name: Clear pending marker for Reload sshd AppArmor profile
  ansible.builtin.file:
    path: "{{ handler_retry_dir }}/Reload sshd AppArmor profile"
    state: absent
  listen: Reload sshd AppArmor profile
  when: apparmor_kernel is defined

# -r replaces the loaded profile in place, so a running fail2ban-server picks
# up changed rules, or a switch between complain and enforce, without a
# restart.
- name: Reload fail2ban-server AppArmor profile
  ansible.builtin.command:
    cmd: apparmor_parser -r /etc/apparmor.d/usr.bin.fail2ban-server
  changed_when: true
  # Undefined for the same reason as in Reload sshd AppArmor profile.
  when: apparmor_kernel is defined and apparmor_kernel.stat.exists

- name: Clear pending marker for Reload fail2ban-server AppArmor profile
  ansible.builtin.file:
    path: "{{ handler_retry_dir }}/Reload fail2ban-server AppArmor profile"
    state: absent
  listen: Reload fail2ban-server AppArmor profile
  when: apparmor_kernel is defined
