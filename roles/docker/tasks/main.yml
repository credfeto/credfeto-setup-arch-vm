---
- name: Ensure /etc/docker directory exists
  ansible.builtin.file:
    path: /etc/docker
    state: directory
    owner: root
    group: root
    mode: "0755"
  when: container_runtime == 'docker'

- name: Configure Docker daemon
  ansible.builtin.copy:
    src: daemon.json
    dest: /etc/docker/daemon.json
    owner: root
    group: root
    mode: "0644"
    validate: dockerd --validate --config-file=%s
  notify: Restart docker
  when: container_runtime == 'docker'

- name: Remove legacy Docker systemd security drop-in
  ansible.builtin.file:
    path: /etc/systemd/system/docker.service.d/security.conf
    state: absent
  notify:
    - Reload systemd
    - Restart docker
  when: container_runtime == 'docker'

- name: Enable and start docker.socket
  ansible.builtin.systemd:
    name: docker.socket
    enabled: true
    state: started
    daemon_reload: true
  when: container_runtime == 'docker'

- name: Enable docker service
  ansible.builtin.systemd:
    name: docker
    enabled: true
  when: container_runtime == 'docker'

# Separate from enabling so that changed here means docker was actually
# started, which the Restart docker handler relies on to skip a second start
# in the same run.
- name: Start docker service
  ansible.builtin.systemd:
    name: docker
    state: started
  register: docker_started
  when: container_runtime == 'docker'
