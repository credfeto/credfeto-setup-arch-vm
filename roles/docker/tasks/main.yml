---
- name: Ensure /etc/docker directory exists
  ansible.builtin.file:
    path: /etc/docker
    state: directory
    owner: root
    group: root
    mode: "0755"
  when: container_runtime == 'docker'

- name: Configure Docker daemon
  ansible.builtin.copy:
    src: daemon.json
    dest: /etc/docker/daemon.json
    owner: root
    group: root
    mode: "0644"
    validate: dockerd --validate --config-file=%s
  register: docker_configure_docker_daemon
  notify: Restart docker
  when: container_runtime == 'docker'

- name: Record Restart docker as pending
  ansible.builtin.include_role:
    name: handler_retry
    tasks_from: pending
  vars:
    handler_retry_pending: [Restart docker]
  when: docker_configure_docker_daemon is changed  # noqa: no-handler - marker must precede the handler

- name: Remove legacy Docker systemd security drop-in
  ansible.builtin.file:
    path: /etc/systemd/system/docker.service.d/security.conf
    state: absent
  register: docker_remove_legacy_docker_systemd_security_drop_in
  notify:
    - Reload systemd
    - Restart docker
  when: container_runtime == 'docker'

- name: Record Reload systemd and Restart docker as pending
  ansible.builtin.include_role:
    name: handler_retry
    tasks_from: pending
  vars:
    handler_retry_pending: [Reload systemd, Restart docker]
  when: docker_remove_legacy_docker_systemd_security_drop_in is changed  # noqa: no-handler - marker must precede the handler

- name: Enable and start docker.socket
  ansible.builtin.systemd:
    name: docker.socket
    enabled: true
    state: started
    daemon_reload: true
  when: container_runtime == 'docker'

- name: Enable docker service
  ansible.builtin.systemd:
    name: docker
    enabled: true
  when: container_runtime == 'docker'

# Separate from enabling so that changed here means docker was actually
# started, which the Restart docker handler relies on to skip a second start
# in the same run.
- name: Start docker service
  ansible.builtin.systemd:
    name: docker
    state: started
  register: docker_started
  when: container_runtime == 'docker'
