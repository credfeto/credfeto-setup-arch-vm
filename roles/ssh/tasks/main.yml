  when: ssh_authorizedkeyscommanduser is changed  # noqa: no-handler - marker must precede the handler

# The users role installs the consent banner text; without this sshd
# never shows it (Banner defaults to none), which would leave the file
# satisfying the lynis check while doing nothing (#62).
- name: Configure sshd Banner
