---
- name: Ensure sshd_config.d directory exists
  ansible.builtin.file:
    path: /etc/ssh/sshd_config.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Generate sshd host keys if missing
  ansible.builtin.command:
    cmd: ssh-keygen -A
    creates: /etc/ssh/ssh_host_ed25519_key

- name: Enable and start sshd
  ansible.builtin.systemd:
    name: sshd
    enabled: true
    state: started
    daemon_reload: true

# sshd reads its config as root, so nothing else needs read access; the
# package ships it 0644 (lynis FILE-7524, #62). The drop-ins under
# sshd_config.d are already written 0600 by the tasks below.
- name: Restrict sshd_config to root only
  ansible.builtin.file:
    path: /etc/ssh/sshd_config
    owner: root
    group: root
    mode: "0600"

- name: Remove legacy misnamed logingraceime config file
  ansible.builtin.file:
    path: /etc/ssh/sshd_config.d/10-logingraceime.conf
    state: absent
  register: ssh_remove_legacy_misnamed_logingraceime_config_file
  notify: Reload sshd

- name: Record Reload sshd as pending
  ansible.builtin.include_role:
    name: handler_retry
    tasks_from: pending
  vars:
    handler_retry_pending: [Reload sshd]
  when: ssh_remove_legacy_misnamed_logingraceime_config_file is changed  # noqa: no-handler - marker must precede the handler

- name: Remove legacy sshd systemd security drop-in
  ansible.builtin.file:
    path: /etc/systemd/system/sshd.service.d/security.conf
    state: absent
  register: ssh_remove_legacy_sshd_systemd_security_drop_in
  notify: Reload sshd

- name: Record Reload sshd as pending
  ansible.builtin.include_role:
    name: handler_retry
    tasks_from: pending
  vars:
    handler_retry_pending: [Reload sshd]
  when: ssh_remove_legacy_sshd_systemd_security_drop_in is changed  # noqa: no-handler - marker must precede the handler

# Host keys
- name: Configure sshd HostKey ed25519
  ansible.builtin.copy:
    dest: /etc/ssh/sshd_config.d/10-hostkey-ed25519.conf
    content: "HostKey /etc/ssh/ssh_host_ed25519_key\n"
    owner: root
    group: root
    mode: "0600"
  register: ssh_hostkey_ed25519
  notify: Reload sshd

- name: Record Reload sshd as pending
  ansible.builtin.include_role:
