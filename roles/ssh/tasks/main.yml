    tasks_from: pending
  vars:
    handler_retry_pending: [Reload sshd]
  when: ssh_permitrootlogin is changed  # noqa: no-handler - marker must precede the handler

# Older runs wrote PermitRootLogin yes into 9*-*rootlogin.conf files. sshd
# takes the first value it reads, so 10-permitrootlogin.conf wins today, but
# a leftover file would turn root login on if that one were ever removed or
# renamed.
- name: Find leftover PermitRootLogin override files
  ansible.builtin.find:
    paths: /etc/ssh/sshd_config.d
    # Older runs used several spellings: 999-RootLogin.conf,
    # 9999-permitrootlogin.conf, 9999_permitrootlogin.conf.
    patterns: '(?i)^9\d*[-_].*rootlogin\.conf$'
    use_regex: true
  register: ssh_leftover_rootlogin

- name: Remove leftover PermitRootLogin override files
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: absent
  loop: "{{ ssh_leftover_rootlogin.files }}"
  loop_control:
    label: "{{ item.path }}"
  register: ssh_remove_leftover_permitrootlogin_override_files
  notify: Reload sshd

- name: Record Reload sshd as pending
  ansible.builtin.include_role:
    name: handler_retry
    tasks_from: pending
  vars:
    handler_retry_pending: [Reload sshd]
  when: ssh_remove_leftover_permitrootlogin_override_files is changed  # noqa: no-handler - marker must precede the handler

