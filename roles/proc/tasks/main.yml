---
- name: Create proc system group
  ansible.builtin.group:
    name: proc
    system: true
    state: present

- name: Write systemd-logind proc group drop-in directory
  ansible.builtin.file:
    path: /etc/systemd/system/systemd-logind.service.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Write systemd-logind proc group drop-in
  ansible.builtin.copy:
    dest: /etc/systemd/system/systemd-logind.service.d/proc-group.conf
    content: |
      [Service]
      SupplementaryGroups=proc
    owner: root
    group: root
    mode: "0644"
  register: proc_write_systemd_logind_proc_group_drop_in
  notify:
    - Reload systemd
    - Restart systemd-logind

- name: Record Reload systemd and Restart systemd-logind as pending
  ansible.builtin.include_role:
    name: handler_retry
    tasks_from: pending
  vars:
    handler_retry_pending: [Reload systemd, Restart systemd-logind]
  when: proc_write_systemd_logind_proc_group_drop_in is changed  # noqa: no-handler - marker must precede the handler

- name: Write proc mount hidepid drop-in directory
  ansible.builtin.file:
    path: /etc/systemd/system/proc.mount.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Write proc mount hidepid drop-in
  ansible.builtin.copy:
    dest: /etc/systemd/system/proc.mount.d/hidepid.conf
    content: |
      [Mount]
      Options=nosuid,nodev,noexec,hidepid=2,gid=proc
    owner: root
    group: root
    mode: "0644"
  register: proc_write_proc_mount_hidepid_drop_in
  notify: Reload systemd

- name: Record Reload systemd as pending
  ansible.builtin.include_role:
    name: handler_retry
    tasks_from: pending
  vars:
    handler_retry_pending: [Reload systemd]
  when: proc_write_proc_mount_hidepid_drop_in is changed  # noqa: no-handler - marker must precede the handler

- name: Check if /proc already has hidepid configured
  ansible.builtin.command:
    cmd: findmnt /proc --output OPTIONS -n
  register: proc_mount_opts
  changed_when: false

- name: Remount /proc with hidepid=2 live
  ansible.posix.mount:
    path: /proc
    src: proc
    fstype: proc
    opts: nosuid,nodev,noexec,hidepid=2,gid=proc
    state: remounted
  when: "'hidepid' not in proc_mount_opts.stdout"
