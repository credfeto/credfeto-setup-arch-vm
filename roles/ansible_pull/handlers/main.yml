---
- name: Reload systemd
  ansible.builtin.systemd:
    daemon_reload: true

# Only here: when several roles define a handler of the same name, the last
# one loaded is the one that runs, and this role loads after every other role
# that defines Reload systemd.
# Kept while any unit check that ran failed, so the next run re-notifies
# Reload systemd and that check runs again rather than being skipped as
# unchanged. A skipped check verified nothing but also found nothing wrong:
# it only skips when its own units are unchanged and no marker is pending.
- name: Clear pending marker for Reload systemd
  ansible.builtin.file:
    path: "{{ handler_retry_dir }}/Reload systemd"
    state: absent
  listen: Reload systemd
  when:
    - ansible_pull_unit_check is not defined or ansible_pull_unit_check is skipped or ansible_pull_unit_check.rc == 0
    - services_unit_check is not defined or services_unit_check is skipped or services_unit_check.rc == 0
    - podman_unit_check is not defined or podman_unit_check is skipped or podman_unit_check.rc == 0

# A start in this run already used the current timer unit, so only a timer
# that was running before the run needs restarting. ansible_pull_timer_started
# is undefined when a task failed before Start ansible-pull timer and
# force_handlers runs this anyway; restart then, as the start never happened.
# A skipped unit check verified nothing, so it never allows a restart. It
# cannot happen in practice: the change or pending marker that notifies this
# handler is the same condition that makes the check run.
- name: Restart ansible-pull timer
  ansible.builtin.systemd:
    name: ansible-pull.timer
    state: restarted
    daemon_reload: true
  when:
    - ansible_pull_unit_check is defined
    - ansible_pull_unit_check is not skipped
    - ansible_pull_unit_check.rc == 0
    - ansible_pull_timer_started is not defined or ansible_pull_timer_started is not changed

# Timer units have no process to fork; is-active on the timer shows it is
# really armed after the restart.
- name: Check ansible-pull timer is running after restarting it
  ansible.builtin.command:
    cmd: systemctl is-active --quiet ansible-pull.timer  # noqa: command-instead-of-module - read-only probe
  register: ansible_pull_timer_state
  changed_when: false
  until: ansible_pull_timer_state.rc == 0
  retries: 10
  delay: 1
  listen: Restart ansible-pull timer
  # Same condition as the restart: only check after a restart it made.
  when:
    - ansible_pull_unit_check is defined
    - ansible_pull_unit_check is not skipped
    - ansible_pull_unit_check.rc == 0
    - ansible_pull_timer_started is not defined or ansible_pull_timer_started is not changed

- name: Clear pending marker for Restart ansible-pull timer
  ansible.builtin.file:
    path: "{{ handler_retry_dir }}/Restart ansible-pull timer"
    state: absent
  listen: Restart ansible-pull timer
  when:
    - ansible_pull_unit_check is defined
    - ansible_pull_unit_check is not skipped
    - ansible_pull_unit_check.rc == 0
