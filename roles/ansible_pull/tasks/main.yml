---
- name: Install ansible-pull.service unit
  ansible.builtin.copy:
    src: ansible-pull.service
    dest: /etc/systemd/system/ansible-pull.service
    owner: root
    group: root
    mode: "0644"
  register: ansible_pull_install_ansible_pull_service_unit
  notify: Reload systemd

- name: Record Reload systemd as pending
  ansible.builtin.include_role:
    name: handler_retry
    tasks_from: pending
  vars:
    handler_retry_pending: [Reload systemd]
  when: ansible_pull_install_ansible_pull_service_unit is changed  # noqa: no-handler - marker must precede the handler

# Restart (not just daemon-reload) on change: a running timer keeps the
# schedule it was started with, so without the restart the fleet would only
# pick up a new schedule at its next reboot. Restarting the timer is safe
# from inside a timer-triggered run: the Requires= on ansible-pull.service
# only issues a start job, which is a no-op while the service (this play)
# is already active. From a MANUAL run (ssh/ad-hoc ansible-pull, where the
# service is not active) the restart instead fires the service immediately
# (the long-elapsed OnBootSec trigger re-arms on timer start), i.e. one
# extra pull of the timer's own branch right after this play - idempotent
# and benign on main, but during branch testing that extra main pull
# reverts this unit file to main's version (observed on arch-vm-test).
- name: Install ansible-pull.timer unit
  ansible.builtin.copy:
    src: ansible-pull.timer
    dest: /etc/systemd/system/ansible-pull.timer
    owner: root
    group: root
    mode: "0644"
  register: ansible_pull_install_ansible_pull_timer_unit
  notify: Restart ansible-pull timer

- name: Record Restart ansible-pull timer as pending
  ansible.builtin.include_role:
    name: handler_retry
    tasks_from: pending
  vars:
    handler_retry_pending: [Restart ansible-pull timer]
  when: ansible_pull_install_ansible_pull_timer_unit is changed  # noqa: no-handler - marker must precede the handler

# Verify both installed units before anything enables, starts or restarts the
# timer. failed_when: false so the result is always registered and the
# Restart ansible-pull timer handler can check it under force_handlers.
# Only a change or a pending marker leads to a reload or restart, so an
# unchanged unit with nothing pending was already verified by the run that
# installed it and the check is skipped.
- name: Check ansible-pull units
  ansible.builtin.command:
    cmd: systemd-analyze verify /etc/systemd/system/ansible-pull.service /etc/systemd/system/ansible-pull.timer
  register: ansible_pull_unit_check
  changed_when: false
  failed_when: false
  when: >-  # noqa: no-handler - the check must run before the handlers it guards
    ansible_pull_install_ansible_pull_service_unit is changed
    or ansible_pull_install_ansible_pull_timer_unit is changed
    or 'Reload systemd' in handler_retry_pending_handlers
    or 'Restart ansible-pull timer' in handler_retry_pending_handlers

- name: Fail when the ansible-pull units are invalid
  ansible.builtin.fail:
    msg: >-
      ansible-pull unit check failed: {{ ansible_pull_unit_check.stdout }}
      {{ ansible_pull_unit_check.stderr }} {{ ansible_pull_unit_check.msg | default('') }}
  when: ansible_pull_unit_check is not skipped and ansible_pull_unit_check.rc != 0

- name: Enable ansible-pull timer
  ansible.builtin.systemd:
    name: ansible-pull.timer
    enabled: true
    daemon_reload: true

# Separate from enabling so that changed here means the timer was actually
# started, which the Restart ansible-pull timer handler relies on to skip a
# second start in the same run.
- name: Start ansible-pull timer
  ansible.builtin.systemd:
    name: ansible-pull.timer
    state: started
  register: ansible_pull_timer_started
