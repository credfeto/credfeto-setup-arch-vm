---
- name: Ensure /etc/containers directory exists
  ansible.builtin.file:
    path: /etc/containers
    state: directory
    owner: root
    group: root
    mode: "0755"
  when: container_runtime == 'podman'

- name: Configure Podman registries
  ansible.builtin.copy:
    src: registries.conf
    dest: /etc/containers/registries.conf
    owner: root
    group: root
    mode: "0644"
  when: container_runtime == 'podman'

- name: Enable kernel.unprivileged_userns_clone for Podman rootless containers
  ansible.posix.sysctl:
    name: kernel.unprivileged_userns_clone
    value: "1"
    sysctl_file: /etc/sysctl.d/10-kernel.unprivileged_userns_clone.conf
    reload: true
  when: container_runtime == 'podman'

- name: Deploy Podman security audit script
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/scripts/podman-security-audit.sh"
    dest: /usr/local/bin/podman-security-audit.sh
    owner: root
    group: root
    mode: "0755"
  when: container_runtime == 'podman'

- name: Install podman-security-audit.service unit
  ansible.builtin.copy:
    src: podman-security-audit.service
    dest: /etc/systemd/system/podman-security-audit.service
    owner: root
    group: root
    mode: "0644"
  notify: Reload systemd
  when: container_runtime == 'podman'

- name: Install podman-security-audit.timer unit
  ansible.builtin.copy:
    src: podman-security-audit.timer
    dest: /etc/systemd/system/podman-security-audit.timer
    owner: root
    group: root
    mode: "0644"
  notify: Reload systemd
  when: container_runtime == 'podman'

# Verify both installed units before anything reloads systemd or enables the
# timer. failed_when: false so the result is always registered and the
# Reload systemd handler can check it under force_handlers.
- name: Check podman-security-audit units
  ansible.builtin.command:
    cmd: systemd-analyze verify /etc/systemd/system/podman-security-audit.service /etc/systemd/system/podman-security-audit.timer
  register: podman_unit_check
  changed_when: false
  failed_when: false
  when: container_runtime == 'podman'

- name: Fail when the podman-security-audit units are invalid
  ansible.builtin.fail:
    msg: >-
      podman-security-audit unit check failed: {{ podman_unit_check.stdout }}
      {{ podman_unit_check.stderr }} {{ podman_unit_check.msg | default('') }}
  when:
    - container_runtime == 'podman'
    - podman_unit_check.rc != 0

- name: Enable and start podman-security-audit timer
  ansible.builtin.systemd:
    name: podman-security-audit.timer
    enabled: true
    state: started
    daemon_reload: true
  when: container_runtime == 'podman'
