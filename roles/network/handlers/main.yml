---
# A start in this run already read the current DNS server drop-in, so only a
# systemd-resolved that was running before the run needs restarting.
# network_resolved_started is undefined when a task failed before Start
# systemd-resolved and force_handlers runs this anyway; restart then, as the
# start never happened.
- name: Restart systemd-resolved
  ansible.builtin.systemd:
    name: systemd-resolved
    state: restarted
  when: network_resolved_started is not defined or network_resolved_started is not changed

# systemd-resolved.service is Type=notify; resolvectl status succeeds only
# once the resolver answers on D-Bus, so poll it and fail the run when it
# never does.
- name: Check systemd-resolved is running after restarting it
  ansible.builtin.command:
    cmd: resolvectl status
  register: network_resolved_state
  changed_when: false
  until: network_resolved_state.rc == 0
  retries: 10
  delay: 1
  listen: Restart systemd-resolved
  # Same condition as the restart: only check after a restart it made.
  when: network_resolved_started is not defined or network_resolved_started is not changed

- name: Clear pending marker for Restart systemd-resolved
  ansible.builtin.file:
    path: "{{ handler_retry_dir }}/Restart systemd-resolved"
    state: absent
  listen: Restart systemd-resolved
