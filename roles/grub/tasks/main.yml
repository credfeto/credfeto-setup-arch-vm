---
# Fix typo from earlier versions of the install script
- name: Fix hardened_usercopy typo in GRUB config
  ansible.builtin.replace:
    path: /etc/default/grub
    regexp: 'hardend_usercopy'
    replace: 'hardened_usercopy'
  register: grub_fix_hardened_usercopy_typo_in_grub_config
  notify: boot-config-changed

- name: Record boot-config-changed as pending
  ansible.builtin.include_role:
    name: handler_retry
    tasks_from: pending
  vars:
    handler_retry_pending: [boot-config-changed]
  when: grub_fix_hardened_usercopy_typo_in_grub_config is changed  # noqa: no-handler - marker must precede the handler

# Ensure lsm= includes integrity
- name: Ensure lsm parameter includes integrity
  ansible.builtin.replace:
    path: /etc/default/grub
    regexp: '(GRUB_CMDLINE_LINUX="[^"]*)\blsm=(?!.*\bintegrity\b)([^" ]*)'
    replace: '\1lsm=landlock,lockdown,yama,integrity,apparmor,bpf'
  register: grub_ensure_lsm_parameter_includes_integrity
  notify: boot-config-changed

- name: Record boot-config-changed as pending
  ansible.builtin.include_role:
    name: handler_retry
    tasks_from: pending
  vars:
    handler_retry_pending: [boot-config-changed]
  when: grub_ensure_lsm_parameter_includes_integrity is changed  # noqa: no-handler - marker must precede the handler

