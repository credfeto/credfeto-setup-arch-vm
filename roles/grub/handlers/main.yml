---
- name: Regenerate GRUB config
  ansible.builtin.command:
    cmd: grub-mkconfig -o /boot/grub/grub.cfg
  changed_when: true
  listen: boot-config-changed

- name: Regenerate initramfs
  ansible.builtin.command:
    cmd: mkinitcpio -P
  changed_when: true
  listen: boot-config-changed

# Applies the tightened fmask/dmask from the fstab edit without waiting
# for a reboot (lynis FILE-7524, #62).
- name: Remount /boot
  ansible.posix.mount:
    path: /boot
    state: remounted
