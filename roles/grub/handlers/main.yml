---
- name: Regenerate GRUB config
  ansible.builtin.command:
    cmd: grub-mkconfig -o /boot/grub/grub.cfg
  changed_when: true
  listen: boot-config-changed

- name: Regenerate initramfs
  ansible.builtin.command:
    cmd: mkinitcpio -P
  changed_when: true
  listen: boot-config-changed

- name: Clear pending marker for boot-config-changed
  ansible.builtin.file:
    path: "{{ handler_retry_dir }}/boot-config-changed"
    state: absent
  listen: boot-config-changed
