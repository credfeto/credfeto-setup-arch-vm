---
- name: Create autoupdate system user
  ansible.builtin.user:
    name: autoupdate
    system: true
    create_home: true
    home: /home/autoupdate
    shell: /usr/sbin/nologin
    state: present

- name: Ensure autoupdate home directory has correct ownership
  ansible.builtin.file:
    path: /home/autoupdate
    state: directory
    owner: autoupdate
    group: autoupdate
    mode: "0750"

- name: Ensure .ansible/tmp directory exists for autoupdate user
  ansible.builtin.file:
    path: /home/autoupdate/.ansible/tmp
    state: directory
    owner: autoupdate
    group: autoupdate
    mode: "0700"

- name: Write sudoers file for autoupdate (NOPASSWD ALL for ansible-pull)
  ansible.builtin.copy:
    dest: /etc/sudoers.d/autoupdate
    content: "autoupdate ALL=(ALL) NOPASSWD: ALL\n"
    owner: root
    group: root
    mode: "0440"
    validate: visudo -c -f %s

- name: Remove legacy 01_markr sudoers file
  ansible.builtin.file:
    path: /etc/sudoers.d/01_markr
    state: absent

- name: Create markr user
  ansible.builtin.user:
    name: markr
    create_home: true
    home: /home/markr
    shell: /bin/bash
    state: present
    password: "{{ lookup('ansible.builtin.password', '/dev/null', length=32, chars=['ascii_letters', 'digits', 'punctuation']) | password_hash('sha512') }}"
    update_password: on_create

- name: Ensure markr home directory has correct ownership
  ansible.builtin.file:
    path: /home/markr
    state: directory
    owner: markr
    group: markr
    mode: "0750"

- name: Write sudoers file for markr (NOPASSWD ALL)
  ansible.builtin.copy:
    dest: /etc/sudoers.d/markr
    content: "markr ALL=(ALL) NOPASSWD: ALL\n"
    owner: root
    group: root
    mode: "0440"
    validate: visudo -c -f %s

- name: Add authorized SSH keys for markr from GitHub
  ansible.posix.authorized_key:
    user: markr
    state: present
    key: https://github.com/credfeto.keys

# lynis AUTH-9230 (#62). ENCRYPT_METHOD is already YESCRYPT (the Arch
# default); the cost factor defaults to 5 - raise it so any password
# hash that does get created (accounts are key-only, but local recovery
# passwords are possible) costs an attacker more to crack. Matching an
# optionally-commented shipped line is the same pattern as the pacman
# [options] flags in the packages role.
- name: Set YESCRYPT_COST_FACTOR in login.defs
  ansible.builtin.lineinfile:
    path: /etc/login.defs
    regexp: '^#?YESCRYPT_COST_FACTOR\b'
    line: "YESCRYPT_COST_FACTOR 7"
    state: present

# lynis AUTH-9328 (#62): the default 022 makes every newly created file
# world-readable. 027 strips "other" access from files created in login
# sessions (files 640, directories 750); services are unaffected.
- name: Set default umask 027 in login.defs
  ansible.builtin.lineinfile:
    path: /etc/login.defs
    regexp: '^#?UMASK\b'
    line: "UMASK\t\t027"
    state: present
