---
# container_runtime controls which container engine is installed: 'docker'
# (default), 'podman', or 'none' for hosts that run neither (both runtime roles
# skip and the services role removes any stale cleanup units of either).
# Override per host in host_vars/<ansible_nodename>.yml (e.g. proxy.lan.yml).
# site.yml loads that file explicitly: the play targets localhost, so Ansible's
# own host_vars lookup (keyed by inventory_hostname) never matches it.
container_runtime: docker

# DNS server hosts (dns-01, dns-02, ...) get special handling in several
# roles: cache-only pacman configuration (packages role, #224) and a static
# resolver instead of systemd-resolved (network role). Defined here as a
# lazily-evaluated var rather than a set_fact so every role sees it with no
# task-ordering dependency. ansible_hostname is the real machine hostname;
# inventory_hostname is always "localhost" (hosts: localhost).
host_is_dns_server: "{{ ansible_hostname is match('^dns-[0-9]{2}$') }}"

# Hosts that take packages ONLY from the internal pacman cache (Server= with no
# public mirrorlist, no reflector): every host except the Linux package caches
# themselves, which are the cache's upstream and must reach the public mirrors.
# A host whose egress firewall is enforcing can never allow-list rotating
# public mirrors, and pacman fetches the repository databases from Server=/
# Include= sources, not from CacheServer=, so a mirrorlist fallback would fail
# there anyway.
host_pacman_cache_only: "{{ not (ansible_hostname is match('^linux-cache-[0-9]{2}$')) }}"

# Base URL of the internal pacman cache (the Linux caches, behind the reverse
# proxies). Every host except the caches themselves uses it as its ONLY
# package source (host_pacman_cache_only).
pacman_cache_base: https://pacman.markridgwell.com/repo

# Full per-repo server URLs derived from the base. The packages role both
# writes these as literals and matches them back with regexps (the restore
# and removal tasks that flip a host between the cache-only and mirrorlist pacman.conf
# shapes); deriving every occurrence from one definition keeps literal and
# regexp byte-identical - a regexp that silently stopped matching would
# strand hosts in the wrong shape with every task reporting ok.
pacman_cache_main_server: "{{ pacman_cache_base }}/archlinux/$repo/os/$arch"
pacman_cache_chaotic_server: "{{ pacman_cache_base }}/chaotic-aur/x86_64"
