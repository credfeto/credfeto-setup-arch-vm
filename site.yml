---
- name: Configure Arch Linux VM
  hosts: localhost
  connection: local
  become: true

  roles:
    - packages
    - users
    - starship
    - sysctl
    - kernel_modules
    - proc
    - docker
    - podman
    - grub
    - ssh
    - firewall
    - network
    - role: dns_egress
      when: network_is_dns_server
    - apparmor
    - services
    - ansible_pull
    - audit
    - telegraf
    - reboot
