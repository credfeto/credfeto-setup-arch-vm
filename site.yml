---
- name: Configure Arch Linux VM
  hosts: localhost
  connection: local
  become: true
  # A notified handler reflects a change already written to disk, so it must
  # run even when a later role's task fails - otherwise disk and runtime
  # drift apart with no self-healing path: the notifying task is idempotent,
  # reports ok on the next run, and never re-notifies. Concrete case (#229):
  # the ansible-pull.timer restart handler dropped by a failure in a later
  # role would leave the host on its old in-memory schedule until an
  # unrelated reboot.
  force_handlers: true

  # inventory_hostname is always "localhost" under ansible-pull, so Ansible
  # never auto-loads host_vars/<hostname>.yml; load it by the real node name.
  # Tagged always so --tags <role> runs still see the per-host overrides.
  pre_tasks:
    - name: Load per-host variable overrides
      ansible.builtin.include_vars:
        file: "{{ item }}"
      loop: "{{ query('ansible.builtin.first_found', files=[ansible_nodename ~ '.yml'], paths=[playbook_dir ~ '/host_vars'], skip=True) }}"
      tags: always

    - name: Validate container_runtime
      ansible.builtin.assert:
        that: container_runtime in ['docker', 'podman', 'none']
        fail_msg: "container_runtime must be docker, podman or none, not '{{ container_runtime }}'"
        quiet: true
      tags: always

  roles:
    # First, because it reads the pending handler markers and publishes
    # handler_retry_pending_handlers, which later roles' verify checks use.
    - handler_retry
    - packages
    - users
    - starship
    - sysctl
    - kernel_modules
    - proc
    - docker
    - podman
    - grub
    - ssh
    - firewall
    - fail2ban
    - network
    - apparmor
    - services
    - qemu_guest_agent
    - ansible_pull
    - audit
    - telegraf
    - reboot
